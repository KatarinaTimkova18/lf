<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LF SZU</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LF SZU">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141211" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a calm single column like a study planner; summary first, then subjects as grids of sets, one question per screen in practice. */
:root{
  --bg:#f7f5f2; --surface:#ffffff; --ink:#1c1714; --muted:#7a6f66; --line:#e6e0d9; --soft:#efebe6;
  --bio:#5f8f5a; --bio-soft:#e7f0e3; --bio-deep:#3f6b3b;
  --che:#8a73b8; --che-soft:#eee9f6; --che-deep:#634f93;
  --ok:#2f6b4a; --ok-soft:#e3efe7; --bad:#a23b36; --bad-soft:#f7e4e2;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; --img-filter:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141211; --surface:#1d1a19; --ink:#f2ede8; --muted:#a3978d; --line:#35302c; --soft:#25211f;
  --bio:#93c08c; --bio-soft:#1f2a1e; --bio-deep:#b5d9ae;
  --che:#b9a6e3; --che-soft:#29233a; --che-deep:#d3c6f2;
  --ok:#83c79f; --ok-soft:#1c2c23; --bad:#ee918a; --bad-soft:#3b2220; --img-filter:invert(.92) hue-rotate(180deg); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141211; --surface:#1d1a19; --ink:#f2ede8; --muted:#a3978d; --line:#35302c; --soft:#25211f;
  --bio:#93c08c; --bio-soft:#1f2a1e; --bio-deep:#b5d9ae;
  --che:#b9a6e3; --che-soft:#29233a; --che-deep:#d3c6f2;
  --ok:#83c79f; --ok-soft:#1c2c23; --bad:#ee918a; --bad-soft:#3b2220; --img-filter:invert(.92) hue-rotate(180deg); color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding-block:18px 56px;display:flex;flex-direction:column;gap:26px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
sub,sup{font-size:.7em;line-height:0}
.fig{display:block;max-width:100%;height:auto;margin:8px 0 2px;filter:var(--img-filter);border-radius:6px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:500;font-size:clamp(38px,10.5vw,54px);line-height:1.02;margin:6px 0 0;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:italic}
h2{font-family:var(--display);font-weight:500;font-size:26px;margin:0;line-height:1.15;text-wrap:balance}
h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.lead{color:var(--muted);margin:8px 0 0;max-width:48ch}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:13px 20px;border-radius:99px;font-weight:600;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn[disabled]{opacity:.35;cursor:default}
.btn.wide{flex:1 1 140px}
.link{border:0;background:none;padding:6px 0;color:var(--muted);font-size:15px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block}
.sync.on i{background:var(--ok)}

/* overview */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-family:var(--display);font-size:36px;font-weight:500;line-height:1}
.ring .c span{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.subj{display:flex;flex-direction:column;gap:12px;min-width:0}
.sline{display:flex;flex-direction:column;gap:5px}
.sline .h{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.sline .h b{font-weight:600}
.track{height:6px;border-radius:6px;background:var(--soft);overflow:hidden;display:flex}
.track i{display:block;height:100%}
.legend{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:6px;border-radius:3px;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stats div{background:var(--surface);padding:12px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stats b{font-family:var(--display);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted);line-height:1.3}
.today{display:flex;flex-direction:column;gap:8px}
.tcard{display:grid;grid-template-columns:6px 1fr auto;gap:14px;align-items:center;padding:14px 16px 14px 0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;width:100%;overflow:hidden}
.tcard .stripe{align-self:stretch;background:var(--c)}
.tcard .t{font-weight:600}
.tcard .s{font-size:13px;color:var(--muted)}
.tcard .go{font-size:20px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px}
.tile b{font-family:var(--display);font-size:21px;font-weight:500;line-height:1.15}
.tile span{font-size:13px;color:var(--muted)}
.tile.bio{background:var(--bio-soft);border-color:transparent}
.tile.bio b{color:var(--bio-deep)}
.tile.che{background:var(--che-soft);border-color:transparent}
.tile.che b{color:var(--che-deep)}
.chart{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:6px;border-bottom:1px solid var(--line)}
.chart div{flex:1;max-width:34px;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;height:100%;position:relative}
.chart div i{display:block;border-radius:3px 3px 0 0}
.chart div em{text-align:center;font-style:normal;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}

/* subject sets */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 14px;border-radius:99px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.set{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 12px 10px;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative;min-width:0}
.set .r{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.set .p{font-family:var(--display);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.set .bar{height:4px;border-radius:4px;background:var(--soft);overflow:hidden}
.set .bar i{display:block;height:100%;background:var(--c)}
.set.done{background:var(--c-soft);border-color:var(--c)}
.set .badge{position:absolute;top:9px;right:9px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.set .badge.m{color:var(--c-deep)}
.set .badge.w{color:var(--bad)}
.set .badge.g{color:var(--muted)}
.bio-c{--c:var(--bio);--c-soft:var(--bio-soft);--c-deep:var(--bio-deep)}
.che-c{--c:var(--che);--c-soft:var(--che-soft);--c-deep:var(--che-deep)}

/* forms */
.field{display:flex;flex-direction:column;gap:8px}
.field label,.field .lbl{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:var(--bg)}
.chip .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:6px;vertical-align:middle}
.info{font-size:14px;color:var(--muted);border-left:2px solid var(--line);padding:2px 0 2px 12px}

/* quiz */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;white-space:nowrap}
.prog{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c,var(--ink));transition:width .25s}
.qhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.qnum{font-family:var(--display);font-style:italic;font-size:20px;color:var(--c-deep,var(--ink))}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--c-soft);color:var(--c-deep)}
.qtext{font-family:var(--display);font-size:clamp(21px,5.6vw,26px);line-height:1.32;margin:4px 0 0;font-weight:500;overflow-wrap:anywhere}
.hint{font-size:13px;color:var(--muted)}
.answers{display:flex;flex-direction:column;gap:10px}
.ans{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);transition:border-color .15s,background .15s}
.ans .l{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:14px}
.ans .tx{padding-top:4px;min-width:0;overflow-wrap:anywhere}
.ans.sel{border-color:var(--ink)}
.ans.sel .l{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ans.ok{border-color:var(--ok);background:var(--ok-soft)}
.ans.ok .l{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.ans.bad{border-color:var(--bad);background:var(--bad-soft)}
.ans.bad .l{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.ans.miss{border-color:var(--ok);border-style:dashed}
.ans.miss .l{border-color:var(--ok);color:var(--ok)}
.ans[disabled]{cursor:default}
.verdict{border-radius:var(--r);padding:14px 16px;font-weight:600;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict span{font-weight:500}
.flag{border:0;background:none;color:var(--muted);font-size:13px;padding:4px 0;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.flag[aria-pressed="true"]{color:var(--bad)}
.dock{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 78%,transparent);display:flex;gap:10px}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
.navgrid button{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:34px;font-size:12px;font-variant-numeric:tabular-nums;padding:0}
.navgrid button.a{background:var(--soft);border-color:var(--muted)}
.navgrid button.cur{outline:2px solid var(--ink);outline-offset:1px}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
.timer.low{color:var(--bad)}

/* result */
.big{font-family:var(--display);font-size:clamp(64px,19vw,96px);line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:.38em;color:var(--muted)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.list > div{padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;display:grid;grid-template-columns:4.2em 1fr;gap:8px}
.list b{font-family:var(--display);font-style:italic;font-weight:500;color:var(--c-deep)}
.list em{font-style:normal;color:var(--muted);font-size:13px;display:block}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split div{border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:2px}
.split b{font-family:var(--display);font-size:30px;font-weight:500;font-variant-numeric:tabular-nums}
.split span{font-size:13px}
.foot{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.countdown{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.countdown b{font-family:var(--display);font-size:40px;font-weight:500;line-height:1}
.countdown span{font-weight:600;line-height:1.3}
.countdown small{font-weight:400;color:var(--muted);font-size:13px}
.tile.calc{background:var(--soft);border-color:transparent}
.opts{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px}
.opts small{font-size:13px}
.switch{position:relative;width:48px;height:28px;border-radius:99px;border:0;background:var(--line);flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--ink)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.set .tn{font-size:14px;font-weight:600;line-height:1.25;padding-right:44px;min-height:2.5em}
.howto{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px dashed var(--che);background:var(--che-soft);color:var(--che-deep);border-radius:var(--r);padding:12px 14px}
.howto span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.howto b{font-weight:600}
.tlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.trow{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tinfo{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 200px}
.tinfo b{font-weight:600}
.tinfo span{font-size:13px;color:var(--muted)}
.tinfo em{font-style:normal;color:var(--bad)}
.tinfo .bar{height:4px;border-radius:4px;background:var(--soft);overflow:hidden;max-width:220px}
.tinfo .bar i{display:block;height:100%;background:var(--c)}
.tbtn{display:flex;gap:6px}
.btn.small{padding:8px 14px;font-size:13px}
.ftable{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.ftable div{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ftable div:last-child{border-bottom:0}
.ftable span{color:var(--muted);font-size:14px}
.ftable b{font-weight:600;font-variant-numeric:tabular-nums}
.ftable.two b{font-weight:500;font-size:15px}
.masses{margin:0;line-height:1.9;font-variant-numeric:tabular-nums}
.fx{display:flex;flex-direction:column;gap:8px}
.fx div{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:17px;font-weight:600;overflow-wrap:anywhere}
.steps,.exbox ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:10px}
.steps li::marker{font-family:var(--display);font-style:italic;color:var(--muted)}
.exbox{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface)}
.exbox p{margin:0 0 10px;font-weight:600}
.pit{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.pit li::marker{color:var(--bad)}
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-in{max-width:640px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}

.rings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rcard{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 0}
.rcard .ring{width:min(132px,36vw);height:min(132px,36vw)}
.rcard .ring .c b{color:var(--c-deep)}
.rcard .ring .c span{color:var(--c-deep);letter-spacing:.06em}
.rcard .ring svg circle:first-child{stroke:var(--c-soft)}
.rsub{font-size:13px;color:var(--muted);text-align:center;line-height:1.4}
.rbad{color:var(--bad)}
.total{margin:0;font-size:14px;color:var(--muted);text-align:center}
:root{--bad-ring:rgba(162,59,54,.45)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bad-ring:rgba(238,145,138,.5)}}
:root[data-theme="dark"]{--bad-ring:rgba(238,145,138,.5)}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script src="data.js"></script>
<script src="guides.js"></script>
<script>
"use strict";
/* ---------- bank ---------- */
const SUBJ = {
  bio:{name:"Biológia", short:"Bio", cls:"bio-c"},
  che:{name:"Chémia", short:"Chem", cls:"che-c"}
};
const BANK = window.BANK || {bio:[],che:[]};
const BY = {bio:{}, che:{}};
const SETS = {bio:[], che:[]};
for (const s of ["bio","che"]) {
  for (const q of BANK[s]) {
    BY[s][q[0]] = q;
    const k = Math.floor((q[0]-1)/50);
    (SETS[s][k] = SETS[s][k] || []).push(q[0]);
  }
}
const MAXN = {bio: Math.max(...BANK.bio.map(q=>q[0])), che: Math.max(...BANK.che.map(q=>q[0]))};
const TOTAL = BANK.bio.length + BANK.che.length;
const L = ["A","B","C","D"];
function fmt(t){ return t.replace(/\[\[IMG:([\w]+)\]\]/g, '<img class="fig" src="img/$1.png" alt="vzorec" loading="lazy">'); }
function setRange(s,k){ return `${k*50+1}–${Math.min((k+1)*50, MAXN[s])}`; }

/* ---------- state ---------- */
const LKEY = "szu-app-v1";
function blank(){ return {v:1, t:0, q:{bio:"0".repeat(MAXN.bio+1), che:"0".repeat(MAXN.che+1)}, w:{bio:"0".repeat(MAXN.bio+1), che:"0".repeat(MAXN.che+1)}, sets:{}, exams:[], flags:[], days:{}}; }
function normalize(x){
  const b = blank(); if (!x || typeof x!=="object") return b;
  for (const s of ["bio","che"]) {
    if (x.q && typeof x.q[s]==="string") b.q[s] = (x.q[s] + b.q[s]).slice(0, MAXN[s]+1);
    if (x.w && typeof x.w[s]==="string") b.w[s] = (x.w[s] + b.w[s]).slice(0, MAXN[s]+1);
  }
  b.sets = x.sets || {}; b.exams = Array.isArray(x.exams)?x.exams:[]; b.flags = Array.isArray(x.flags)?x.flags:[]; b.days = x.days || {}; b.t = x.t || 0;
  return b;
}
let S = blank();
try { S = normalize(JSON.parse(localStorage.getItem(LKEY) || "null")); } catch(e){}
let local = {};
try { local = JSON.parse(localStorage.getItem(LKEY+"-local") || "{}") || {}; } catch(e){}

/* ---------- derived stats ---------- */
function qState(s,n){ return S.q[s][n] || "0"; }
function setQ(s,n,c){ const a=S.q[s]; S.q[s]=a.slice(0,n)+c+a.slice(n+1); }
function addWrong(s,n){ const a=S.w[s]; const c=Math.min(9,(+a[n]||0)+1); S.w[s]=a.slice(0,n)+c+a.slice(n+1); }
function subjStats(s){
  let m=0,k=0,w=0,seen=0;
  for (const q of BANK[s]) { const c=qState(s,q[0]); if(c!=="0")seen++; if(c==="3"||c==="2")m++; else if(c==="1")w++; }
  return {m,k,w,seen,total:BANK[s].length};
}
function setInfo(s,k){
  const st = S.sets[s+k] || {};
  const nums = SETS[s][k]; let m=0,w=0;
  for (const n of nums){ const c=qState(s,n); if(c==="3"||c==="2")m++; if(c==="1")w++; }
  let status = "new";
  if (st.n) status = (st.s||0)>=2 ? "mastered" : (st.l/nums.length>=0.9 ? "good" : "weak");
  return {st, nums, m, w, status, last: st.n? Math.round(st.l/nums.length*100) : null};
}
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function streakDays(){ let c=0; const d=new Date(); for(;;){ const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); if(S.days[k]) { c++; d.setDate(d.getDate()-1);} else { if(c===0 && k===today()){ d.setDate(d.getDate()-1); continue;} break; } } return c; }
function recommend(){
  const out=[];
  const cand=[];
  for (const s of ["bio","che"]) SETS[s].forEach((nums,k)=>{ const i=setInfo(s,k); if(i.status!=="new"&&i.status!=="mastered") cand.push({s,k,i,score:(i.last||0) - (Date.now()-(i.st.d||0))/864e5*2}); });
  cand.sort((a,b)=>a.score-b.score);
  for (const c of cand.slice(0,2)) out.push({s:c.s,k:c.k,why: c.i.status==="weak" ? `naposledy ${c.i.last} % · opakovať` : `naposledy ${c.i.last} % · dotiahni na 100 %`});
  for (const s of ["bio","che"]) { if (out.length>=3) break; const k=SETS[s].findIndex((_,k)=>setInfo(s,k).status==="new"); if (k>=0 && !out.some(o=>o.s===s&&o.k===k)) out.push({s,k,why:"nová sada"}); }
  if (out.length<3) for (const s of ["bio","che"]) SETS[s].forEach((_,k)=>{ const i=setInfo(s,k); if(out.length<3 && i.status==="mastered" && Date.now()-(i.st.d||0)>7*864e5) out.push({s,k,why:"zvládnutá · osviež si ju"}); });
  return out.slice(0,3);
}

function ring(pct, segs, label){
  const R=58, C=2*Math.PI*R; let off=0;
  const arcs = segs.map(([v,col])=>{ const len=v*C; const a=`<circle cx="66" cy="66" r="${R}" fill="none" stroke="${col}" stroke-width="9" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" stroke-linecap="butt"/>`; off+=len; return a; }).join("");
  return `<div class="ring"><svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--soft)" stroke-width="9"/>${arcs}</svg><div class="c"><div><b class="num">${pct}<small style="font-size:.5em">%</small></b><br><span>${label||"správne"}</span></div></div></div>`;
}

function genPool(){
  const subs = G.s==="mix"?["bio","che"]:[G.s]; const out=[];
  for (const s of subs) {
    let nums;
    if (G.src==="sets") nums = G.sel[s].flatMap(k=>SETS[s][k]||[]);
    else nums = BANK[s].map(q=>q[0]);
    if (G.src==="weak") nums = nums.filter(n=>{const c=qState(s,n);return c==="1"||c==="2";});
    if (G.src==="new") nums = nums.filter(n=>qState(s,n)==="0");
    for (const n of nums) out.push({s,n});
  }
  return out;
}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function startSet(s,k){

  app.innerHTML = `
    <div class="top"><button class="link" id="back">← ${exam?"Prerušiť":"Späť"}</button><span class="eyebrow">${run.title}</span><span class="count">${exam?`<span class="timer" id="timer"></span> · `:""}${run.i+1} / ${n}</span></div>
    <div class="prog ${cls}"><i style="width:${(run.i+(run.done[run.i]?1:0))/n*100}%"></i></div>
    <section class="${cls}">
      <div class="qhead"><span class="qnum">Otázka ${q[0]}.</span><span class="tag">${SUBJ[it.s].name}</span></div>
      <div class="qtext">${fmt(q[1])}</div>
      <div class="hint">Označ všetky správne odpovede.</div>
    </section>
    <div class="answers">${perm.map((o,j)=>`<button class="ans${picked.has(L[o])?" sel":""}" data-k="${L[o]}"><span class="l">${L[j]}</span><span class="tx">${fmt(q[2][o])}</span></button>`).join("")}</div>
    ${ct&&GUIDES[ct]?`<button class="howto" id="howto"><span>Ako na to</span><b>${GUIDES[ct].t}</b></button>`:""}
    <div id="verdict"></div>
    <button class="flag" id="flag" aria-pressed="${flagged}">${flagged?"Nahlásené ako chybná otázka · zrušiť":"Nahlásiť chybu v otázke"}</button>
    ${exam?`<details><summary class="muted" style="cursor:pointer;font-size:14px">Prehľad otázok (${run.picks.filter(p=>p.length).length}/${n} zodpovedaných)</summary><div class="navgrid" style="margin-top:10px">${run.list.map((x,j)=>`<button data-j="${j}" class="${run.picks[j].length?"a":""} ${j===run.i?"cur":""}">${j+1}</button>`).join("")}</div></details>`:""}
    <div class="dock">${exam
      ? `<button class="btn ghost" id="prev" ${run.i?"":"disabled"}>‹</button><button class="btn wide" id="nextE">${run.i+1<n?"Ďalšia":"Odovzdať test"}</button>`
      : `<button class="btn wide" id="go" ${picked.size?"":"disabled"}>Skontrolovať</button>`}</div>`;
  const back=document.getElementById("back");
  back.onclick=()=>{ saveRun(); go({name:"home"}); };
  const ht=document.getElementById("howto"); if(ht) ht.onclick=()=>openSheet(ct);
  document.getElementById("flag").onclick=()=>{ const id=it.s+"-"+it.n; const i=S.flags.indexOf(id); if(i>=0)S.flags.splice(i,1); else S.flags.push(id); touch(); reportShared(it, i<0); const f=document.getElementById("flag"); const on=i<0; f.setAttribute("aria-pressed",on); f.textContent=on?"Nahlásené ako chybná otázka · zrušiť":"Nahlásiť chybu v otázke"; };
  app.querySelectorAll(".ans").forEach(b=>b.onclick=()=>{
    if (!exam && run.done[run.i]) return;
    const k=b.dataset.k, arr=run.picks[run.i], j=arr.indexOf(k);
    j>=0?arr.splice(j,1):arr.push(k); b.classList.toggle("sel");
    if (exam) saveRun(); else document.getElementById("go").disabled = !arr.length;
  });
  if (exam) {
    document.getElementById("prev").onclick=()=>{ run.i--; saveRun(); render(); window.scrollTo(0,0); };
    document.getElementById("nextE").onclick=()=>{ if (run.i+1<n){ run.i++; saveRun(); render(); window.scrollTo(0,0);} else confirmSubmit(); };
    app.querySelectorAll(".navgrid button").forEach(b=>b.onclick=()=>{ run.i=+b.dataset.j; saveRun(); render(); window.scrollTo(0,0); });
    tick(); clearInterval(timerInt); timerInt=setInterval(tick,1000);
  } else {
    if (run.done[run.i]) showVerdict();
    document.getElementById("go").onclick=()=> run.done[run.i] ? nextQ() : check();
  }
}
function tick(){
  if (!run || run.mode!=="exam") return clearInterval(timerInt);
  const el=document.getElementById("timer"); if(!el) return;
  const sec=Math.floor((Date.now()-run.started)/1000);
  if (run.limit){ const left=run.limit*60-sec; if(left<=0){ clearInterval(timerInt); return finishExam(); } el.textContent=mmss(left); el.classList.toggle("low",left<300); }
  else el.textContent=mmss(sec);
}
function mmss(s){ const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0"); }
function confirmSubmit(){
  const un = run.picks.filter(p=>!p.length).length;
  const d=document.querySelector(".dock");
  d.innerHTML = `<div style="display:flex;flex-direction:column;gap:10px;width:100%"><div class="info">${un?`Nezodpovedaných otázok: ${un}. `:""}Naozaj odovzdať test?</div><div class="row"><button class="btn ghost wide" id="no">Ešte nie</button><button class="btn wide" id="yes">Odovzdať</button></div></div>`;
  document.getElementById("no").onclick=()=>render();
  document.getElementById("yes").onclick=finishExam;
}
function grade(it, picks){ const c=BY[it.s][it.n][3]; return c.length===picks.length && picks.every(k=>c.includes(k)); }
function record(it, ok){
  const c=qState(it.s,it.n);
  if (ok) setQ(it.s,it.n, c==="2"||c==="3" ? "3" : "2");
  else { setQ(it.s,it.n,"1"); addWrong(it.s,it.n); }
  S.days[today()] = (S.days[today()]||0)+1;
}
function check(){
  const it=run.list[run.i]; const ok=grade(it, run.picks[run.i]);
  run.done[run.i]=true; if(ok) run.right++; else run.wrong.push(it);
  record(it, ok); touch();
  run.i++; saveRun(); run.i--;
  showVerdict();
}
function showVerdict(){
  const it=run.list[run.i], q=BY[it.s][it.n]; const correct=q[3].split(""); const p=run.picks[run.i]; const ok=grade(it,p);
  const perm=(run.perm && run.perm[run.i]) || [0,1,2,3];
  const shown=perm.map((o,j)=>correct.includes(L[o])?L[j]:null).filter(Boolean);
  app.querySelectorAll(".ans").forEach(b=>{ const k=b.dataset.k; b.disabled=true; b.classList.remove("sel");
    if (correct.includes(k)&&p.includes(k)) b.classList.add("ok"); else if(!correct.includes(k)&&p.includes(k)) b.classList.add("bad"); else if(correct.includes(k)) b.classList.add("miss"); });
  document.getElementById("verdict").innerHTML=`<div class="verdict ${ok?"ok":"bad"}">${ok?"Správne":"Nesprávne"}<span>správne: ${shown.join(", ")}</span></div>`;
  const g=document.getElementById("go"); g.disabled=false; g.textContent = run.i+1<run.list.length ? "Ďalšia otázka" : "Zobraziť výsledok";
}
function nextQ(){ run.i++; if (run.i<run.list.length){ saveRun(); render(); window.scrollTo(0,0); } else finishPractice(); }
function finishPractice(){
  const n=run.list.length;
  if (run.set && !run.redo) {
    const st=S.sets[run.set]=S.sets[run.set]||{};
    st.n=(st.n||0)+1; st.l=run.right; st.b=Math.max(st.b||0,run.right); st.d=Date.now();
    st.s = run.right===n ? (st.s||0)+1 : 0;
    touch();
  }
  clearRun();
  view={name:"result", r:{title:run.title, mode:"practice", right:run.right, n, wrong:run.wrong, set:run.set, redo:run.redo, mastered: run.set && !run.redo && S.sets[run.set].s>=2}};
  run=null; render(); window.scrollTo(0,0);
}
function finishExam(){
  clearInterval(timerInt);
  let b=0,c=0; const wrong=[];
  run.list.forEach((it,j)=>{ const p=run.picks[j]; const ok=grade(it,p); if(ok){ it.s==="bio"?b++:c++; } else wrong.push(it); if(p.length) record(it,ok); });
  const t=Math.floor((Date.now()-run.started)/1000);
  S.exams.push({d:Date.now(),b,c,t}); if(S.exams.length>40) S.exams=S.exams.slice(-40);
  touch(); clearRun();
  view={name:"result", r:{title:run.title, mode:"exam", b, c, t, n:run.list.length, right:b+c, wrong}};
  run=null; render(); window.scrollTo(0,0);
}
function result(){
  const r=view.r; const exam=r.mode==="exam"; const pct=Math.round(r.right/r.n*100);
  const wl=r.wrong;
  let msg;
  if (exam) msg = `Trvalo ti to ${mmss(r.t)}. ${pct>=90?"Výborné, takto to vyzerá na prijatie.":pct>=75?"Dobrý základ. Zameraj sa na otázky nižšie.":"Prejdi si chyby a sady, ktoré svietia na opakovanie."}`;
  else if (!wl.length) msg = r.mastered ? "Všetko správne a sada je zvládnutá na 100 %." : r.set && !r.redo ? "Všetko správne. Ešte raz bez chyby a sada je zvládnutá." : "Všetko správne.";
  else msg = `Zle si mala ${wl.length} ${wl.length===1?"otázku":wl.length<5?"otázky":"otázok"}. Prejdi si ich znova, kým nebudú všetky správne.`;
  app.innerHTML = `
    <div class="top"><button class="link" id="back">← Prehľad</button><span class="eyebrow">${r.title}</span><span></span></div>
    <section><div class="eyebrow">${exam?"Výsledok testu":r.redo?"Opakovanie chýb":"Výsledok"}</div>
      <div class="big">${r.right}<small> / ${r.n}</small></div><p class="lead">${msg}</p></section>
    ${exam?`<div class="split"><div style="background:var(--bio-soft)"><span style="color:var(--bio-deep)">Biológia</span><b style="color:var(--bio-deep)">${r.b}<small style="font-size:.5em"> / 80</small></b></div><div style="background:var(--che-soft)"><span style="color:var(--che-deep)">Chémia</span><b style="color:var(--che-deep)">${r.c}<small style="font-size:.5em"> / 80</small></b></div></div>`:""}
    <div class="row">
      ${wl.length?`<button class="btn wide" id="redo">Zopakovať chybné (${wl.length})</button>`:""}
      ${r.set?`<button class="btn ghost wide" id="again">Celá sada znova</button>`:""}
    </div>
    ${wl.length?`<section><h3>Chybné otázky</h3><div class="list">${wl.map(it=>{const q=BY[it.s][it.n];return `<div class="${SUBJ[it.s].cls}"><b>${SUBJ[it.s].short} ${q[0]}</b><span>${fmt(q[1])}<em>správne: ${q[3].split("").map(k=>fmt(q[2][L.indexOf(k)])).join(" · ")}</em></span></div>`;}).join("")}</div></section>`:""}`;
  document.getElementById("back").onclick=()=>go({name:"home"});
  const rd=document.getElementById("redo"); if(rd) rd.onclick=()=>startRun({title:r.title.replace(/ · chyby$/,"")+" · chyby", list:wl, mode:"practice", set:r.set, redo:true});
  const ag=document.getElementById("again"); if(ag) ag.onclick=()=>{ const s=r.set.slice(0,3), k=+r.set.slice(3); startRun({title:`${SUBJ[s].name} · sada ${k+1}`, list:SETS[s][k].map(n=>({s,n})), mode:"practice", set:r.set}); };
}
function flags(){
  app.innerHTML = `
    <div class="top"><button class="link" id="back">← Prehľad</button><span class="eyebrow">Nahlásené</span><span></span></div>
    <section><h2>Nahlásené otázky</h2><p class="lead">Otázky, pri ktorých si myslíš, že je chyba v kľúči alebo v texte. Pošli mi ich čísla v Claude a skontrolujem ich.</p></section>
    <div class="list">${S.flags.map(id=>{const [s,n]=id.split("-");const q=BY[s]&&BY[s][n];if(!q)return"";return `<div class="${SUBJ[s].cls}"><b>${SUBJ[s].short} ${n}</b><span>${fmt(q[1])}<em>v kľúči: ${q[3].split("").map(k=>k+") "+fmt(q[2][L.indexOf(k)])).join(" · ")}</em></span></div>`;}).join("")}</div>`;
  document.getElementById("back").onclick=()=>go({name:"home"});
}
async function reportShared(it, on){
  if (!db) return;
  try { const ref=db.doc("reports/"+it.s+"-"+it.n); if(on) await ref.set({s:it.s,n:it.n,t:Date.now()}); else await ref.delete(); } catch(e){}
}


function transfer(){
  const code=exportCode();
  app.innerHTML = `
    <div class="top"><button class="link" id="back">← Prehľad</button><span class="eyebrow">Prenos pokroku</span><span></span></div>
    <section><h2>Preniesť pokrok</h2><p class="lead">Na tomto zariadení skopíruj kód. Na druhom zariadení otvor tú istú stránku, choď sem a kód vlož. Pokrok na druhom zariadení sa nahradí týmto.</p></section>
    <section><div class="field"><span class="lbl">Kód z tohto zariadenia</span>
      <textarea id="out" readonly rows="4" style="width:100%;font:12px/1.4 ui-monospace,monospace;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);color:var(--ink);resize:none">${code}</textarea></div>
      <div class="row"><button class="btn wide" id="copy">Kopírovať kód</button></div></section>
    <section><div class="field"><span class="lbl">Vložiť kód z iného zariadenia</span>
      <textarea id="in" rows="4" placeholder="Sem vlož skopírovaný kód" style="width:100%;font:12px/1.4 ui-monospace,monospace;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);color:var(--ink);resize:none"></textarea></div>
      <div class="row"><button class="btn ghost wide" id="load">Načítať pokrok</button></div><p class="info" id="msg">Kód si pošli napríklad sama sebe cez správy alebo e-mail.</p></section>`;
  document.getElementById("back").onclick=()=>go({name:"home"});
  document.getElementById("copy").onclick=async()=>{ const o=document.getElementById("out"); try{ await navigator.clipboard.writeText(o.value); document.getElementById("copy").textContent="Skopírované"; }catch(e){ o.focus(); o.select(); document.getElementById("msg").textContent="Kód je označený, skopíruj ho podržaním prsta."; } };
  document.getElementById("load").onclick=()=>{ const v=document.getElementById("in").value; try{ importCode(v); document.getElementById("msg").textContent="Pokrok načítaný."; setTimeout(()=>go({name:"home"}),700);}catch(e){ document.getElementById("msg").textContent="Tento kód sa nedá načítať. Skontroluj, či si skopírovala celý kód."; } };
}


/* ---------- príklady & vzorce ---------- */
const CORDER = {che:["mol","prvok","plyn","c","w","riedenie","rovnica","neutral","ph","teplo","rychlost","ks","k","osmo"], bio:["mendel","krv","hw","h2"]};
function typeStats(t){ const T=CALCTYPES[t]; let m=0,w=0; for(const n of T.list){ const c=qState(T.s,n); if(c==="3"||c==="2")m++; if(c==="1")w++; } return {m,w,n:T.list.length}; }
function examples(){
  const all=[]; for(const s of ["che","bio"]) for(const t of CORDER[s]) if(CALCTYPES[t]) CALCTYPES[t].list.forEach(n=>all.push({s,n}));
  const row=t=>{ const T=CALCTYPES[t], g=GUIDES[t], st=typeStats(t); return `<div class="trow ${SUBJ[T.s].cls}">
      <div class="tinfo"><b>${g?g.t:t}</b><span>${st.n} ${st.n===1?"príklad":st.n<5?"príklady":"príkladov"} · správne ${st.m}/${st.n}${st.w?` · <em>${st.w} zle</em>`:""}</span>
      <span class="bar"><i style="width:${st.m/st.n*100}%"></i></span></div>
      <div class="tbtn"><button class="btn small" data-pr="${t}">Precvičiť</button><button class="btn ghost small" data-gd="${t}">Postup</button></div></div>`; };
  app.innerHTML = `
    <div class="top"><button class="link" id="back">← Prehľad</button><span class="eyebrow">Príklady</span><span></span></div>
    <section><h1>Príklady</h1><p class="lead">Všetky výpočtové otázky z banky, roztriedené podľa typu. Ku každému typu je postup krok po kroku. Všetky príklady sú prepočítané a súhlasia s kľúčom.</p>
      <div class="row"><button class="btn wide" id="allEx">Precvičiť všetky príklady (${all.length})</button></div></section>
    <section><h3>Chémia</h3><div class="tlist">${CORDER.che.filter(t=>CALCTYPES[t]).map(row).join("")}</div></section>
    <section><h3>Biológia · genetika</h3><div class="tlist">${CORDER.bio.filter(t=>CALCTYPES[t]).map(row).join("")}</div></section>`;
  document.getElementById("back").onclick=()=>go({name:"home"});
  document.getElementById("allEx").onclick=()=>startRun({title:"Všetky príklady", list:shuffle(all), mode:"practice"});
  app.querySelectorAll("[data-pr]").forEach(b=>b.onclick=()=>{ const t=b.dataset.pr, T=CALCTYPES[t]; startRun({title:GUIDES[t]?GUIDES[t].t:"Príklady", list:shuffle(T.list.map(n=>({s:T.s,n}))), mode:"practice"}); });
  app.querySelectorAll("[data-gd]").forEach(b=>b.onclick=()=>go({name:"guide", t:b.dataset.gd, from:"examples"}));
}
function formulas(){
  const B=BASICS;
  const list=s=>CORDER[s].filter(t=>GUIDES[t]).map(t=>`<button class="tcard" data-gd="${t}" style="--c:var(--${s})"><span class="stripe"></span><span><span class="t">${GUIDES[t].t}</span><div class="s">${GUIDES[t].f[0]}</div></span><span class="go">›</span></button>`).join("");
  app.innerHTML = `
    <div class="top"><button class="link" id="back">← Prehľad</button><span class="eyebrow">Vzorce a postupy</span><span></span></div>
    <section><h1>Vzorce a <em>postupy</em></h1><p class="lead">Všetko, čo potrebuješ na príklady z testovnice, na jednom mieste. Ťukni na typ príkladu a uvidíš postup krok po kroku aj s vyriešeným príkladom.</p></section>
    ${B?`<section><h3>Základné vzorce</h3><div class="ftable">${B.core.map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join("")}</div></section>
    <section><h3>Konštanty</h3><div class="ftable">${B.consts.map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join("")}</div></section>
    <section><h3>Jednotky</h3><div class="ftable two">${B.units.map(([a,b])=>`<div><b>${a}</b><b>${b}</b></div>`).join("")}</div></section>
    <section><h3>Relatívne atómové hmotnosti (zaokrúhlené)</h3><p class="masses">${B.masses}</p></section>`:""}
    <section><h3>Postupy · chémia</h3><div class="today">${list("che")}</div></section>
    <section><h3>Postupy · genetika</h3><div class="today">${list("bio")}</div></section>`;
  document.getElementById("back").onclick=()=>go({name:"home"});
  app.querySelectorAll("[data-gd]").forEach(b=>b.onclick=()=>go({name:"guide", t:b.dataset.gd, from:"formulas"}));
}
function guideBody(t){
  const g=GUIDES[t]; if(!g) return "";
  return `<section class="${SUBJ[g.s].cls}"><span class="tag" style="align-self:flex-start">${SUBJ[g.s].name}</span><h2>${g.t}</h2><p class="lead"><b>Ako ho spoznáš:</b> ${g.when}</p></section>
    <section><h3>Vzorce</h3><div class="fx">${g.f.map(x=>`<div>${x}</div>`).join("")}</div></section>
    <section><h3>Postup krok po kroku</h3><ol class="steps">${g.steps.map(x=>`<li>${x}</li>`).join("")}</ol></section>
    ${g.ex?`<section><h3>Vyriešený príklad · otázka ${g.ex.n}</h3><div class="exbox"><p>${g.ex.q}</p><ol>${g.ex.sol.map(x=>`<li>${x}</li>`).join("")}</ol></div></section>`:""}
    ${g.pit&&g.pit.length?`<section><h3>Pozor na</h3><ul class="pit">${g.pit.map(x=>`<li>${x}</li>`).join("")}</ul></section>`:""}`;
}
function guidePage(t){
  const T=CALCTYPES[t];
  app.innerHTML = `<div class="top"><button class="link" id="back">← ${view.from==="examples"?"Príklady":"Vzorce"}</button><span class="eyebrow">Postup</span><span></span></div>
    ${guideBody(t)}
    ${T?`<div class="dock"><button class="btn wide" id="prac">Precvičiť tento typ (${T.list.length})</button></div>`:""}`;
  document.getElementById("back").onclick=()=>go({name:view.from||"formulas"});
  const pr=document.getElementById("prac"); if(pr) pr.onclick=()=>startRun({title:GUIDES[t].t, list:shuffle(T.list.map(n=>({s:T.s,n}))), mode:"practice"});
}
function openSheet(t){
  const d=document.createElement("div"); d.className="sheet"; d.setAttribute("role","dialog"); d.setAttribute("aria-modal","true");
  d.innerHTML=`<div class="sheet-in"><div class="top"><span class="eyebrow">Ako na to</span><button class="link" id="closeSheet">Zavrieť ✕</button></div>${guideBody(t)}<div class="row"><button class="btn wide" id="closeSheet2">Späť na otázku</button></div></div>`;
  document.body.appendChild(d); document.body.style.overflow="hidden";
  const close=()=>{ d.remove(); document.body.style.overflow=""; };
  d.querySelector("#closeSheet").onclick=close; d.querySelector("#closeSheet2").onclick=close;
}

/* resume an unfinished exam */
render();
if ("serviceWorker" in navigator) { window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
