<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Psychológia Mgr.</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Psychológia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f8f2f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161013" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: tichý luxus – úzky stĺpec, jedna hlavná karta s koliečkom a odpočtom, jemné vlasové linky namiesto rámikov; skupiny: bio šalviová, metodológia levanduľová, psychológia púdrová. */
:root{
  --bg:#f8f2f2; --surface:#fffbfa; --ink:#2b1a21; --muted:#8a6f78; --line:#ecdde0; --soft:#f2e5e8;
  --rose:#b8667e; --rose-deep:#7e3d55; --rose-soft:#f6e3e8; --blush:#fbeef1;
  --bio:#7c9a78; --bio-soft:#eaf0e7; --bio-deep:#4f6d4b;
  --met:#9585bd; --met-soft:#efebf6; --met-deep:#62538f;
  --psy:#d09aa9; --psy-soft:#f8e8ec; --psy-deep:#9a5167;
  --ok:#3f7a5a; --ok-soft:#e6f1ea; --bad:#a8434a; --bad-soft:#f8e4e4; --bad-ring:rgba(168,67,74,.75);
  --display:"Cormorant Garamond","Cormorant","Didot","Bodoni 72",Georgia,serif;
  --body:"Jost","Avenir Next","Futura",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161013; --surface:#20171b; --ink:#f6eaee; --muted:#b29aa2; --line:#3a2a31; --soft:#2a1f24;
  --rose:#e3a1b4; --rose-deep:#f1c3d0; --rose-soft:#3a2530; --blush:#2a1b22;
  --bio:#a3c39e; --bio-soft:#1f2a1f; --bio-deep:#c3dcbe;
  --met:#bcaee6; --met-soft:#28233a; --met-deep:#d8cdf3;
  --psy:#e8b3c1; --psy-soft:#35232b; --psy-deep:#f4d0da;
  --ok:#8bcaa5; --ok-soft:#1c2c23; --bad:#ef9a95; --bad-soft:#3b2222; --bad-ring:rgba(239,154,149,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161013; --surface:#20171b; --ink:#f6eaee; --muted:#b29aa2; --line:#3a2a31; --soft:#2a1f24;
  --rose:#e3a1b4; --rose-deep:#f1c3d0; --rose-soft:#3a2530; --blush:#2a1b22;
  --bio:#a3c39e; --bio-soft:#1f2a1f; --bio-deep:#c3dcbe;
  --met:#bcaee6; --met-soft:#28233a; --met-deep:#d8cdf3;
  --psy:#e8b3c1; --psy-soft:#35232b; --psy-deep:#f4d0da;
  --ok:#8bcaa5; --ok-soft:#1c2c23; --bad:#ef9a95; --bad-soft:#3b2222; --bad-ring:rgba(239,154,149,.8); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;font-weight:400;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.wrap{max-width:620px;margin:0 auto;padding-block:22px 64px;display:flex;flex-direction:column;gap:30px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1{font-family:var(--display);font-weight:500;font-size:clamp(40px,11vw,58px);line-height:1;margin:8px 0 0;letter-spacing:-.005em;text-wrap:balance}
h1 em{font-style:italic;color:var(--rose-deep);font-weight:500}
h2{font-family:var(--display);font-weight:500;font-size:28px;margin:0;line-height:1.15;text-wrap:balance}
h3{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:500}
.lead{color:var(--muted);margin:8px 0 0;max-width:46ch}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums lining-nums}
section{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--rose-deep);background:var(--rose-deep);color:var(--surface);padding:13px 22px;border-radius:99px;font-weight:500;font-size:15px;letter-spacing:.02em}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn[disabled]{opacity:.35;cursor:default}
.btn.wide{flex:1 1 140px}
.btn.small{padding:8px 14px;font-size:13px}
.link{border:0;background:none;padding:6px 0;color:var(--muted);font-size:15px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}

.bio-c{--c:var(--bio);--c-soft:var(--bio-soft);--c-deep:var(--bio-deep)}
.met-c{--c:var(--met);--c-soft:var(--met-soft);--c-deep:var(--met-deep)}
.psy-c{--c:var(--psy);--c-soft:var(--psy-soft);--c-deep:var(--psy-deep)}

/* hlavička */
.mast{display:flex;align-items:center;gap:12px}
.mono-mark{width:40px;height:40px;border-radius:50%;border:1px solid var(--rose);display:grid;place-items:center;font-family:var(--display);font-size:22px;color:var(--rose-deep);flex:none}

/* hlavná karta */
.hero-card{background:none;border:0;padding:4px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
.ring{width:min(184px,48vw);height:min(184px,48vw);position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-family:var(--display);font-size:clamp(38px,12vw,54px);font-weight:500;line-height:1;color:var(--rose-deep)}
.ring .c span{font-size:10px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase}
.hero-card .days{display:flex;flex-direction:column;gap:2px;min-width:0}
.hero-card .days b{font-family:var(--display);font-size:clamp(44px,13vw,60px);font-weight:500;line-height:.95}
.hero-card .days span{font-size:14px}
.hero-card .days small{color:var(--muted);font-size:13px}
.hero-card .sub{grid-column:1/-1;border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted)}
.hero-card input{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:4px 8px;background:var(--surface);color:var(--ink)}
@media (max-width:340px){.hero-card{grid-template-columns:1fr;justify-items:center;text-align:center}.hero-card .days{align-items:center}.hero-card .sub{justify-content:center}}
.rbad{color:var(--bad)}

/* čísla */
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stats div{padding:4px 14px;display:flex;flex-direction:column;gap:0;min-width:0;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0;padding-left:0}
.stats b{font-family:var(--display);font-size:32px;font-weight:500;line-height:1.1;font-variant-numeric:lining-nums tabular-nums}
.stats span{font-size:12px;color:var(--muted);line-height:1.35}

/* skupiny */
.groups{display:flex;flex-direction:column;gap:14px}
.gline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:baseline;background:none;border:0;padding:0;text-align:left;width:100%}
.gline .n{display:flex;align-items:center;gap:10px;font-weight:500}
.gline .n i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.gline .v{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.gline .track{grid-column:1/-1}
.track{height:4px;border-radius:4px;background:var(--soft);overflow:hidden;display:flex}
.track i{display:block;height:100%}

/* dlaždice */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 16px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:104px;position:relative}
.tile b{font-family:var(--display);font-size:22px;font-weight:500;line-height:1.1}
.tile span{font-size:13px;color:var(--muted)}
.tile.g{background:var(--c-soft);border-color:transparent}
.tile.g b{color:var(--c-deep)}
.tile.g::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);margin-bottom:6px}
.tile.soft{background:var(--rose-soft);border-color:transparent}
.tile.soft b{color:var(--rose-deep)}
.tile.wideT{grid-column:1/-1;min-height:0}

/* zoznam predmetov */
.tlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.trow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.trow .stripe{width:9px;height:9px;border-radius:50%;background:var(--c);align-self:start;margin-top:7px}
.tinfo{display:flex;flex-direction:column;gap:5px;min-width:0}
.tinfo b{font-weight:500}
.tinfo span{font-size:13px;color:var(--muted)}
.tinfo em{font-style:normal;color:var(--bad)}
.tinfo .track{max-width:240px;height:3px}
.trow .p{font-family:var(--display);font-size:24px;font-variant-numeric:lining-nums tabular-nums;color:var(--c-deep)}
.prof{font-size:9px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--rose);margin-left:8px;vertical-align:2px}

/* formuláre */
.field{display:flex;flex-direction:column;gap:8px}
.field .lbl{font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--c,var(--rose-deep));border-color:var(--c,var(--rose-deep));color:var(--surface)}
.info{font-size:14px;color:var(--muted);border-left:1px solid var(--rose);padding:2px 0 2px 14px;margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 14px;border-radius:99px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--rose-soft);color:var(--rose-deep);font-weight:500}
.opts{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;font-size:15px;flex-wrap:wrap}

/* otázka */
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;white-space:nowrap}
.prog{height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c,var(--rose));transition:width .25s}
.qhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.qnum{font-family:var(--display);font-style:italic;font-size:22px;color:var(--rose-deep)}
.tag{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--c-soft);color:var(--c-deep)}
.qtext{font-family:var(--display);font-size:clamp(24px,6.2vw,30px);line-height:1.25;margin:4px 0 0;font-weight:500;overflow-wrap:anywhere}
.answers{display:flex;flex-direction:column;gap:10px}
.ans{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);transition:border-color .15s,background .15s}
.ans .l{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:17px}
.ans .tx{padding-top:4px;min-width:0;overflow-wrap:anywhere}
.ans:hover:not([disabled]){border-color:var(--rose)}
.ans.sel{border-color:var(--rose-deep);background:var(--rose-soft)}
.ans.sel .l{background:var(--rose-deep);color:var(--surface);border-color:var(--rose-deep)}
.ans.ok{border-color:var(--ok);background:var(--ok-soft)}
.ans.ok .l{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.ans.bad{border-color:var(--bad);background:var(--bad-soft)}
.ans.bad .l{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.ans[disabled]{cursor:default}
.verdict{border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.verdict b{font-weight:600}
.verdict.ok{background:var(--ok-soft)} .verdict.ok b{color:var(--ok)}
.verdict.bad{background:var(--bad-soft)} .verdict.bad b{color:var(--bad)}
.verdict span{font-size:15px}
.flagb{border:0;background:none;color:var(--muted);font-size:13px;padding:4px 0;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.flagb[aria-pressed="true"]{color:var(--bad)}
.dock{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 78%,transparent);display:flex;gap:10px}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
.navgrid button{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:34px;font-size:12px;font-variant-numeric:tabular-nums;padding:0;position:relative}
.navgrid button.a{background:var(--rose-soft);border-color:var(--rose)}
.navgrid button.cur{outline:2px solid var(--rose-deep);outline-offset:1px}
.navgrid button.f::after{content:"";position:absolute;top:2px;right:2px;border-left:7px solid transparent;border-top:7px solid var(--bad)}
.timer{font-variant-numeric:tabular-nums;font-weight:500;color:var(--rose-deep)}
.timer.low{color:var(--bad)}
.confirm{border:1px solid var(--rose);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--rose-soft)}

/* výsledok */
.big{font-family:var(--display);font-size:clamp(72px,20vw,104px);line-height:1;font-variant-numeric:lining-nums tabular-nums;color:var(--rose-deep)}
.big small{font-size:.36em;color:var(--muted)}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.list > div{padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;display:flex;flex-direction:column;gap:3px}
.list .q{font-weight:500}
.list .you{color:var(--bad)} .list .right{color:var(--ok)}
.list em{font-style:normal;color:var(--muted);font-size:13px}
.ftable{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ftable div{display:flex;justify-content:space-between;gap:6px 16px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ftable span{color:var(--muted);font-size:14px}
.ftable b{font-weight:500;font-variant-numeric:tabular-nums}
.ftable.facts span{color:var(--ink);font-size:15px;flex:1 1 240px}
.ftable.facts b{flex:0 0 140px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.topics{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:7px;font-size:15px}
.topics li::marker{font-family:var(--display);font-style:italic;color:var(--c-deep)}
.foot{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
textarea.code{width:100%;font:12px/1.4 ui-monospace,monospace;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);color:var(--ink);resize:none}
a{color:var(--rose-deep)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="data.js"></script>
<script>
"use strict";
/* ---------- skupiny a predmety ---------- */
const GROUPS = {
  bio:{name:"Biológia", long:"Biologické základy", cls:"bio-c"},
  met:{name:"Metodológia", long:"Metodológia a štatistika", cls:"met-c"},
  psy:{name:"Psychológia", long:"Psychologické disciplíny", cls:"psy-c"}
};
const GOF = {bio:"bio", met:"met", st1:"met", st2:"met", dia:"met", az:"met"};
COURSES.forEach(c => c.g = GOF[c.id] || "psy");
const CMAP = Object.fromEntries(COURSES.map(c => [c.id, c]));
const QS = [];
for (const c of COURSES) (BANK[c.id] || []).forEach((q, i) => QS.push({id: c.id + "-" + i, c: c.id, g: c.g, q: q[0], o: q[1], e: q[2]}));
const QMAP = Object.fromEntries(QS.map(q => [q.id, q]));
const TOTAL = QS.length;
const L = ["A","B","C","D"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pf = v => { const x = v * 100; return x > 0 && x < 10 ? x.toFixed(1).replace(".", ",") : String(Math.round(x)); };

/* ---------- uloženie ---------- */
const LKEY = "psy-fifuk-v1";
function blank(){ return {v:1, q:{}, exams:[], days:{}, flags:[], examDate:"2027-05-28"}; }
let S = blank();
try { const raw = localStorage.getItem(LKEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch(e){}
let OPT = {theme:"auto"};
try { const o = localStorage.getItem(LKEY + "-opt"); if (o) OPT = Object.assign(OPT, JSON.parse(o)); } catch(e){}
let EXAM = null;
try { const x = localStorage.getItem(LKEY + "-exam"); if (x) EXAM = JSON.parse(x); } catch(e){}
function save(){ try { localStorage.setItem(LKEY, JSON.stringify(S)); } catch(e){} }
function saveOpt(){ try { localStorage.setItem(LKEY + "-opt", JSON.stringify(OPT)); } catch(e){} }
function saveExam(){ try { if (EXAM) localStorage.setItem(LKEY + "-exam", JSON.stringify(EXAM)); else localStorage.removeItem(LKEY + "-exam"); } catch(e){} }
function today(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function record(id, ok){
  const r = S.q[id] || [0,0,0]; r[0]++; if (ok) r[1]++; r[2] = ok ? 1 : 0; S.q[id] = r;
  S.days[today()] = (S.days[today()] || 0) + 1; save();
}
function streakDays(){ let c = 0; const d = new Date(); let first = true;
  for (;;){ const k = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    if (S.days[k]){ c++; d.setDate(d.getDate() - 1); first = false; }
    else if (first){ first = false; d.setDate(d.getDate() - 1); }
    else break; }
  return c; }
function stats(filter){
  let total = 0, m = 0, w = 0, seen = 0;
  for (const q of QS){ if (!filter(q)) continue; total++; const r = S.q[q.id]; if (r){ seen++; if (r[2]) m++; else w++; } }
  return {total, m, w, seen};
}
function exportCode(){ return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function importCode(code){ const x = JSON.parse(decodeURIComponent(escape(atob(code.trim())))); if (!x || typeof x.q !== "object") throw new Error("bad"); S = Object.assign(blank(), x); save(); }

function applyTheme(){
  const r = document.documentElement;
  if (OPT.theme === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", OPT.theme);
  const dark = OPT.theme === "dark" || (OPT.theme !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.setAttribute("content", dark ? "#161013" : "#f8f2f2"));
}
applyTheme();

/* ---------- navigácia ---------- */
const app = document.getElementById("app");
let view = {name:"home"}; let run = null; let timerId = null;
function go(v){ view = v; render(); window.scrollTo(0, 0); }
function render(){
  clearInterval(timerId);
  const n = view.name;
  if (n === "home") home();
  else if (n === "group") group(view.g);
  else if (n === "course") course(view.c);
  else if (n === "custom") custom();
  else if (n === "examSetup") examSetup();
  else if (n === "quiz") quiz();
  else if (n === "result") result();
  else if (n === "examQ") examQ();
  else if (n === "examResult") examResult();
  else if (n === "info") info();

const back = (label = "← Prehľad", to = {name:"home"}) => { const b = document.getElementById("back"); if (b) b.onclick = () => go(to); };

/* ---------- koliečko ---------- */
function ring(pct, segs, label){
  const R = 58, C = 2 * Math.PI * R; let off = 0;
  const arcs = segs.map(([v, col]) => { const len = v * C; const a = `<circle cx="66" cy="66" r="${R}" fill="none" stroke="${col}" stroke-width="7" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}"/>`; off += len; return a; }).join("");
  return `<div class="ring"><svg viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--soft)" stroke-width="7"/>${arcs}</svg><div class="c"><div><b class="num">${pct}<small style="font-size:.5em">%</small></b><br><span>${label}</span></div></div></div>`;
}
function daysLeft(){ return Math.max(0, Math.ceil((new Date(S.examDate + "T08:00:00") - new Date()) / 864e5)); }
const dword = n => n === 1 ? "deň" : n >= 2 && n <= 4 ? "dni" : "dní";

/* ---------- vlastný mix ---------- */
let mixSel = new Set(COURSES.map(c => c.id)), mixN = 20, mixF = "all";
function custom(){
  const pool = () => QS.filter(q => mixSel.has(q.c)).filter(q => mixF === "new" ? !S.q[q.id] : mixF === "wrong" ? (S.q[q.id] && !S.q[q.id][2]) : true);
  const n = pool().length;
  app.innerHTML = `
    <div class="top"><button class="link" id="back">← Prehľad</button><span class="eyebrow">Vlastný mix</span><span></span></div>
    <section><h1>Vlastný <em>mix</em></h1><p class="lead">Vyber predmety a počet otázok. Najprv dostaneš tie, ktoré si ešte nevidela alebo máš zle.</p></section>
    ${Object.keys(GROUPS).map(g => `<div class="field ${GROUPS[g].cls}"><span class="lbl" style="color:var(--c-deep)">${GROUPS[g].long}</span><div class="chips">${COURSES.filter(c => c.g === g).map(c => `<button class="chip" data-c="${c.id}" aria-pressed="${mixSel.has(c.id)}">${esc(c.name)}</button>`).join("")}</div></div>`).join("")}
    <div class="row"><button class="btn ghost small" id="selAll">Vybrať všetky</button><button class="btn ghost small" id="selNone">Zrušiť výber</button></div>
    <div class="field"><span class="lbl">Ktoré otázky</span><div class="chips">${[["all","Všetky"],["new","Ešte nevidené"],["wrong","Naposledy zle"]].map(([k,t]) => `<button class="chip" data-f="${k}" aria-pressed="${mixF === k}">${t}</button>`).join("")}</div></div>
    <div class="field"><span class="lbl">Počet</span><div class="chips">${[10,20,40,80].map(k => `<button class="chip" data-n="${k}" aria-pressed="${mixN === k}">${k}</button>`).join("")}</div></div>
    <div class="row"><button class="btn wide" id="start" ${n ? "" : "disabled"}>Začať · ${Math.min(n, mixN)} otázok</button></div>
    <p class="info">${n} otázok zodpovedá výberu.</p>`;
  back();
  app.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { const id = b.dataset.c; mixSel.has(id) ? mixSel.delete(id) : mixSel.add(id); custom(); });
  app.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { mixF = b.dataset.f; custom(); });
  app.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { mixN = +b.dataset.n; custom(); });
  document.getElementById("selAll").onclick = () => { mixSel = new Set(COURSES.map(c => c.id)); custom(); };
  document.getElementById("selNone").onclick = () => { mixSel = new Set(); custom(); };
  document.getElementById("start").onclick = () => {
    const pr = q => { const r = S.q[q.id]; return !r ? 0 : r[2] ? 2 : 1; };
    const list = shuffle(pool()).sort((a, b) => pr(a) - pr(b)).slice(0, mixN);
    startRun("Vlastný mix", list);
  };
}

/* ---------- precvičovanie ---------- */
function startRun(title, list){
  if (!list.length) return;
  run = {title, items: shuffle(list).map(q => ({id: q.id, order: shuffle([0,1,2,3])})), i: 0, ok: 0, picked: null, from: view};
  go({name:"quiz"});
}
function quiz(){
  const R = run; const it = R.items[R.i]; const q = QMAP[it.id]; const c = CMAP[q.c]; const G = GROUPS[c.g];
  const done = R.picked !== null; const flagged = S.flags.includes(q.id);
  app.innerHTML = `
    <div class="top"><button class="link" id="quit">← Ukončiť</button><span class="count">${R.i + 1} / ${R.items.length} · správne ${R.ok}</span></div>
    <div class="prog ${G.cls}"><i style="width:${(R.i + (done ? 1 : 0)) / R.items.length * 100}%"></i></div>
    <section class="${G.cls}">
      <div class="qhead"><span class="tag">${esc(c.name)}</span></div>
      <p class="qtext">${esc(q.q)}</p>
      <div class="answers">${it.order.map((oi, k) => { let cl = ""; if (done){ if (oi === 0) cl = "ok"; else if (k === R.picked) cl = "bad"; } return `<button class="ans ${cl}" data-k="${k}" ${done ? "disabled" : ""}><span class="l">${L[k]}</span><span class="tx">${esc(q.o[oi])}</span></button>`; }).join("")}</div>
      ${done ? `<div class="verdict ${it.order[R.picked] === 0 ? "ok" : "bad"}"><b>${it.order[R.picked] === 0 ? "Správne" : "Nesprávne · správne je " + L[it.order.indexOf(0)]}</b><span>${esc(q.e)}</span></div>
        <button class="flagb" id="flag" aria-pressed="${flagged}">${flagged ? "Nahlásená ako chybná otázka" : "Nahlásiť chybu v otázke"}</button>` : ""}
    </section>
    ${done ? `<div class="dock"><button class="btn wide" id="next">${R.i + 1 >= R.items.length ? "Zobraziť výsledok" : "Ďalšia otázka"}</button></div>` : ""}`;
  document.getElementById("quit").onclick = () => { R.items = R.items.slice(0, R.i + (done ? 1 : 0)); if (!R.items.length) return go(R.from || {name:"home"}); go({name:"result"}); };
  app.querySelectorAll(".ans").forEach(b => b.onclick = () => { if (R.picked !== null) return; R.picked = +b.dataset.k; const ok = it.order[R.picked] === 0; if (ok) R.ok++; record(q.id, ok); quiz(); });
  const nx = document.getElementById("next"); if (nx){ nx.focus({preventScroll:true}); nx.onclick = () => { R.i++; R.picked = null; if (R.i >= R.items.length) go({name:"result"}); else { quiz(); window.scrollTo(0, 0); } }; }
  const fl = document.getElementById("flag"); if (fl) fl.onclick = () => { const i = S.flags.indexOf(q.id); if (i >= 0) S.flags.splice(i, 1); else S.flags.push(q.id); save(); quiz(); };
}
function result(){
  const R = run; const pct = Math.round(R.ok / R.items.length * 100);
  const wrong = R.items.filter(it => S.q[it.id] && !S.q[it.id][2]);
  app.innerHTML = `
    <div class="top"><button class="link" id="back">← Prehľad</button><span class="eyebrow">${esc(R.title)}</span><span></span></div>
    <section><div class="big">${pct}<small> %</small></div><h2>${R.ok} z ${R.items.length} správne</h2></section>
    <div class="row"><button class="btn wide" id="again">Znova to isté</button>${wrong.length ? `<button class="btn ghost wide" id="wr">Iba chyby (${wrong.length})</button>` : ""}</div>`;
  back();
  document.getElementById("again").onclick = () => startRun(R.title, R.items.map(it => QMAP[it.id]));
  const wr = document.getElementById("wr"); if (wr) wr.onclick = () => startRun(R.title + " · chyby", wrong.map(it => QMAP[it.id]));
}
document.addEventListener("keydown", e => {
  if (view.name !== "quiz" || e.target.tagName === "INPUT") return;
  const k = ["a","b","c","d"].indexOf(e.key.toLowerCase());
  if (k >= 0 && run.picked === null){ const b = app.querySelector(`.ans[data-k="${k}"]`); if (b) b.click(); }
  else if (e.key === "Enter" && run.picked !== null){ const n = document.getElementById("next"); if (n){ e.preventDefault(); n.click(); } }
});

/* ---------- simulácia testu ---------- */
let exN = 60, exMin = 60;
function examSetup(){
  const hist = S.exams.slice(-10);
  app.innerHTML = `
    <div class="top"><button class="link" id="back">← Prehľad</button><span class="eyebrow">Simulácia testu</span><span></span></div>

      <p class="info">Fakulta nezverejňuje počet otázok ani čas – tie budú v pozvánke. Nastav si ich sama.</p></section>
    <div class="field"><span class="lbl">Počet otázok</span><div class="chips">${[30,60,100,150].map(n => `<button class="chip" data-n="${n}" aria-pressed="${exN === n}">${n}</button>`).join("")}</div></div>
    <div class="field"><span class="lbl">Čas</span><div class="chips">${[30,45,60,90,120].map(m => `<button class="chip" data-m="${m}" aria-pressed="${exMin === m}">${m} min</button>`).join("")}</div></div>
    <div class="row"><button class="btn wide" id="start">Spustiť test</button></div>
    ${hist.length ? `<section><h3>Moje testy</h3><div class="ftable">${hist.slice().reverse().map(h => `<div><span>${h.date} · ${h.n} otázok</span><b>${h.pct} %</b></div>`).join("")}</div></section>` : ""}`;
  back();
  app.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { exN = +b.dataset.n; examSetup(); });
  app.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { exMin = +b.dataset.m; examSetup(); });
  document.getElementById("start").onclick = () => {
    const byC = shuffle(COURSES).map(c => shuffle(QS.filter(q => q.c === c.id)));
    const picked = []; const n = Math.min(exN, TOTAL);
    for (let r = 0; picked.length < n; r++) for (const arr of byC) if (arr[r] && picked.length < n) picked.push(arr[r]);

const fmtT = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
function examQ(){
  const E = EXAM; const it = E.list[E.i]; const q = QMAP[it.id]; const sel = E.ans[E.i];
  app.innerHTML = `
    <div class="top"><button class="link" id="back">← Prehľad</button><span class="timer" id="timer">${fmtT(E.end - Date.now())}</span></div>

      <div class="answers">${it.order.map((oi, k) => `<button class="ans ${sel === k ? "sel" : ""}" data-k="${k}"><span class="l">${L[k]}</span><span class="tx">${esc(q.o[oi])}</span></button>`).join("")}</div>
      <button class="flagb" id="fl" aria-pressed="${!!E.flag[E.i]}">${E.flag[E.i] ? "Označená na neskôr" : "Označiť na neskôr"}</button>

    <section><h3>Navigácia</h3>
      <div class="navgrid">${E.list.map((_, j) => `<button data-j="${j}" class="${E.ans[j] !== undefined ? "a" : ""} ${E.flag[j] ? "f" : ""} ${j === E.i ? "cur" : ""}">${j + 1}</button>`).join("")}</div>
      <p class="info">Zodpovedané ${Object.keys(E.ans).length} z ${E.list.length}. Ťuknutím na vybranú odpoveď ju zrušíš.</p>
      <div class="row"><button class="btn ghost wide" id="sub">Odovzdať test</button></div>
      <div id="conf"></div></section>`;
  back();
  app.querySelectorAll(".ans").forEach(b => b.onclick = () => { const k = +b.dataset.k; if (E.ans[E.i] === k) delete E.ans[E.i]; else E.ans[E.i] = k; saveExam(); examQ(); });

  document.getElementById("fl").onclick = () => { E.flag[E.i] = !E.flag[E.i]; saveExam(); examQ(); };
  document.getElementById("prev").onclick = () => { E.i--; saveExam(); examQ(); window.scrollTo(0, 0); };
  const nx = document.getElementById("nx"); if (nx) nx.onclick = () => { E.i++; saveExam(); examQ(); window.scrollTo(0, 0); };
  const ask = () => { const miss = E.list.length - Object.keys(E.ans).length;
    const cf = document.getElementById("conf");
    cf.innerHTML = `<div class="confirm"><b>Odovzdať test?</b><span class="muted">${miss ? `Nezodpovedané: ${miss}. ` : ""}Potom už odpovede nezmeníš.</span><div class="row"><button class="btn wide" id="yes">Odovzdať</button><button class="btn ghost wide" id="no">Späť</button></div></div>`;
    document.getElementById("yes").onclick = finishExam; document.getElementById("no").onclick = () => cf.innerHTML = "";
    cf.scrollIntoView({behavior:"smooth", block:"center"}); };
  document.getElementById("sub").onclick = ask; const s2 = document.getElementById("sub2"); if (s2) s2.onclick = ask;
  timerId = setInterval(() => { const left = E.end - Date.now(); const t = document.getElementById("timer"); if (t){ t.textContent = fmtT(left); t.classList.toggle("low", left < 300000); } if (left <= 0) finishExam(); }, 1000);
}
let lastExam = null;
function finishExam(){
  const E = EXAM; if (!E) return; clearInterval(timerId);
  let ok = 0; const per = {}; const wrong = [];
  E.list.forEach((it, j) => { const a = E.ans[j]; const good = a !== undefined && it.order[a] === 0; if (good) ok++; else wrong.push({it, j, a});
    record(it.id, good); const g = QMAP[it.id].g; (per[g] = per[g] || [0,0]); per[g][1]++; if (good) per[g][0]++; });
  const pct = Math.round(ok / E.list.length * 100); const d = new Date();
  S.exams.push({date: `${d.getDate()}. ${d.getMonth()+1}.`, n: E.list.length, ok, pct}); save();
  lastExam = {ok, n: E.list.length, pct, per, wrong, time: fmtT(Math.min(Date.now(), E.end) - E.start)};
  EXAM = null; saveExam(); go({name:"examResult"});
}
function examResult(){
  const X = lastExam; if (!X) return go({name:"home"});
  app.innerHTML = `
    <div class="top"><button class="link" id="back">← Prehľad</button><span class="eyebrow">Výsledok testu</span><span></span></div>
    <section><div class="big">${X.pct}<small> %</small></div><h2>${X.ok} z ${X.n} správne</h2><p class="muted" style="margin:0">čas ${X.time}</p></section>
    <div class="groups">${Object.keys(GROUPS).filter(g => X.per[g]).map(g => { const [a, n] = X.per[g]; return `<div class="gline ${GROUPS[g].cls}"><span class="n"><i></i>${GROUPS[g].long}</span><span class="v">${Math.round(a / n * 100)} % · ${a}/${n}</span><span class="track"><i style="width:${a / n * 100}%;background:var(--c)"></i></span></div>`; }).join("")}</div>
    <p class="info">Prijíma sa podľa poradia, nie podľa pevnej hranice. Rozhoduje, ako dopadnú ostatní.</p>
    <section><h3>Chybné a nezodpovedané (${X.wrong.length})</h3>
      <div class="list">${X.wrong.map(({it, j, a}) => { const q = QMAP[it.id]; return `<div><em>${j + 1}. ${esc(CMAP[q.c].name)}</em><span class="q">${esc(q.q)}</span>${a !== undefined ? `<span class="you">Tvoja: ${esc(q.o[it.order[a]])}</span>` : `<span class="you">Bez odpovede</span>`}<span class="right">Správne: ${esc(q.o[0])}</span><em>${esc(q.e)}</em></div>`; }).join("") || '<div class="muted">Všetko správne.</div>'}</div></section>
    <div class="row"><button class="btn wide" id="new">Nový test</button>${X.wrong.length ? `<button class="btn ghost wide" id="wr">Precvičiť chyby</button>` : ""}</div>`;
  back();
  document.getElementById("new").onclick = () => go({name:"examSetup"});
  const wr = document.getElementById("wr"); if (wr) wr.onclick = () => startRun("Chyby z testu", X.wrong.map(w => QMAP[w.it.id]));
}

    <div class="top"><button class="link" id="back">← Prehľad</button><span class="eyebrow">O prijímačkách</span><span></span></div>

    <div class="ftable facts">
      ${F("Forma", "Písomný test v Moodle. Každý dostane rovnaký počet náhodne generovaných otázok z databázy.")}

      ${F("Ich 3. ročník Bc.", "Do Bc. v 2024/25 prijali 62 z 981 uchádzačov. Títo ľudia teraz končia Bc. a pôjdu na rovnaké prijímačky ako ty.")}
      ${F("Termíny 2026", "Prihláška do 30. 4., test 29. 5., výsledky v júni. Termíny na 2027 ešte nie sú.")}
    </div>

    <section><h3>Odkazy</h3><div class="foot" style="font-size:15px">
      <a href="https://fphil.uniba.sk/pk/mgr/informacia-o-prijimacich-skuskach-na-magistersky-studijny-program-psychologia/" target="_blank" rel="noopener">Informácia o prijímacích skúškach</a>
      <a href="https://ais2.uniba.sk/repo2/repository/default/ais/informacnelisty/2023-2024/FiF/SK/boPS.pdf" target="_blank" rel="noopener">Informačné listy predmetov (PDF)</a>
      <a href="https://ais2.uniba.sk/repo2/repository/default/ais/studijneplany/2023-2024/FiF/SK/boPS.xml" target="_blank" rel="noopener">Študijný plán boPS</a>
    </div></section>`;
  back();

/* ---------- prenos ---------- */
function transfer(){
  app.innerHTML = `
    <div class="top"><button class="link" id="back">← Prehľad</button><span class="eyebrow">Prenos pokroku</span><span></span></div>
    <section><h2>Preniesť pokrok</h2><p class="lead">Na tomto zariadení skopíruj kód. Na druhom otvor tú istú stránku, choď sem a kód vlož. Pokrok na druhom zariadení sa nahradí týmto.</p></section>
    <section><div class="field"><span class="lbl">Kód z tohto zariadenia</span><textarea class="code" id="out" readonly rows="4">${exportCode()}</textarea></div>
      <div class="row"><button class="btn wide" id="copy">Kopírovať kód</button></div></section>
    <section><div class="field"><span class="lbl">Vložiť kód z iného zariadenia</span><textarea class="code" id="in" rows="4" placeholder="Sem vlož skopírovaný kód"></textarea></div>
      <div class="row"><button class="btn ghost wide" id="load">Načítať pokrok</button></div><p class="info" id="msg">Kód si pošli napríklad sama sebe cez správy alebo e-mail.</p></section>`;
  back();
  document.getElementById("copy").onclick = async () => { const o = document.getElementById("out"); try { await navigator.clipboard.writeText(o.value); document.getElementById("copy").textContent = "Skopírované"; } catch(e){ o.focus(); o.select(); document.getElementById("msg").textContent = "Kód je označený, skopíruj ho podržaním prsta."; } };
  document.getElementById("load").onclick = () => { try { importCode(document.getElementById("in").value); document.getElementById("msg").textContent = "Pokrok načítaný."; setTimeout(() => go({name:"home"}), 700); } catch(e){ document.getElementById("msg").textContent = "Tento kód sa nedá načítať. Skontroluj, či si skopírovala celý."; } };
}

render();
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
</script>
